services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: allo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: allo
      POSTGRES_PASSWORD: allo_secret
      POSTGRES_DB: allo_appart
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allo -d allo_appart"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: allo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: allo_meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: meili_local_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    container_name: allo_soketi
    restart: unless-stopped
    environment:
      SOKETI_DEFAULT_APP_ID: allo-app
      SOKETI_DEFAULT_APP_KEY: allo-key
      SOKETI_DEFAULT_APP_SECRET: allo-secret
      SOKETI_DEBUG: "0"
    ports:
      - "6001:6001"

volumes:
  postgres_data:
  redis_data:
  meili_data:
